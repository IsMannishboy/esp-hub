; Board only. Ports, pins, bauds, packet types, LED and log are all in conf.json.

[platformio]
; sources live in the project root, not in src/
src_dir = .

[env]
framework = arduino
upload_speed = 460800
monitor_speed = 115200
upload_resetmethod = nodemcu
; only the .cpp files in the root (not .pio/ etc.)
build_src_filter = +<*.cpp>
; conf.json is built into the firmware, read at boot by load_config()
board_build.embed_txtfiles = conf.json
lib_deps = bblanchon/ArduinoJson@6.19.4

[env:esp32c3]
platform = espressif32@6.4.0
board = esp32-c3-devkitm-1
board_build.f_cpu = 160000000L
build_flags =
	-D ARDUINO_USB_MODE=1

[env:esp32]
platform = espressif32@5.2.0
board = esp32dev
board_build.f_cpu = 240000000L
